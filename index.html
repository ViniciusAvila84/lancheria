<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Caixa Local | Produtos</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar" id="sidebar">
        <div class="sidebar-brand"><span class="brand-mark">L</span><span class="brand-name">Local<span>caixa</span></span></div>
        <nav class="side-nav" aria-label="Navegacao principal">
          <a class="nav-item active" href="#produtos"><span class="nav-icon">⊞</span><span>Produtos</span></a>
        </nav>
        <div class="sidebar-bottom"><div class="store-status"><span></span><div><strong>Caixa aberto</strong><small>Hoje, 03 set 2026</small></div></div><button class="profile-button" type="button" aria-label="Abrir perfil">DL</button></div>
      </aside>
      <main class="main-content" id="produtos">
        <header class="topbar"><button class="collapse-button" id="collapseSidebar" type="button" aria-label="Recolher menu" title="Recolher menu">‹</button><div><p class="overline">Cadastro</p><h1>Produtos</h1></div><div class="topbar-actions"><span class="date-label">03 de setembro de 2026</span><button class="icon-button" type="button" aria-label="Notificacoes">♢</button></div></header>
        <div class="catalog-layout">
          <section class="catalog" id="produtos">
            <div class="section-heading"><div><p class="overline">Catalogo</p><h2>Produtos cadastrados</h2></div><label class="search-box"><span>⌕</span><input id="searchInput" type="search" placeholder="Buscar produto" /></label></div>
            <div class="category-list" id="categoryList"></div>
          </section>
        </div>
      </main>
    </div>
    <script src="script.js"></script>
  </body>
</html>
